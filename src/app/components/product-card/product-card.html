<div class="product-card" (click)="select.emit(product().id)">

  <img
    [src]="product().image"
    [alt]="product().title"
  />

  <h3>{{ product().title }}</h3>

  <p>₹{{ product().price }}</p>
 <button (click)="$event.stopPropagation();  delete.emit(product().id)">
    Delete
  </button>

</div>
