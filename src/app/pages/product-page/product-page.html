<div class="product-container">
  <div class="page-heading">
    <div>
      <h1>Product Management</h1>
      <p>Manage and organize your product inventory.</p>
      <div class="product-summary">
        Showing {{ products().length }} products
      </div>
    </div>
    <button type="button" class="create-button" (click)="createProduct()">
      + Create Product
    </button>
  </div>
  <section class="product-panel">
    <div class="product-toolbar">
      <app-product-search (searchChange)="updateSearchUrl($event)" />

      <div class="sort-control">
        <label for="product-sort">Sort by</label>

        <select id="product-sort" class="sort-select" aria-label="Sort products"
          (change)="changeSort($any($event.target).value)">
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
        </select>
      </div>
    </div>
    @if (loading()) {
    <p class="loading">Loading products...</p>
    } @else if (error()) {
    <p class="error">{{ error() }}</p>
    } @else {
    <app-product-list [products]="products()" (productDelete)="deleteProduct($event)"
      (selectProduct)="selectProduct($event)" />
    }
    @if (totalPages() > 1) {
    <div class="pagination">
      <button type="button" (click)="changePage(page() - 1)" [disabled]="page() === 1">
        Previous
      </button>

      @for (pageNumber of pages(); track pageNumber) {
      <button type="button" (click)="changePage(pageNumber)" [disabled]="pageNumber === page()">
        {{ pageNumber }}
      </button>
      }
      <button type="button" (click)="changePage(page() + 1)" [disabled]="page() === totalPages()">
        Next
      </button>
    </div>
    }
  </section>
</div>
