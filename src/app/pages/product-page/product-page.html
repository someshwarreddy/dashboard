<div class="product-container">

  <h1>Product Management</h1>

  <app-product-search (search)="searchProducts($event)" />

  @if (loading()) {
  <p class="loading">Loading products...</p>
  }

  @if (error()) {
  <p class="error">{{ error() }}</p>
  }

  <app-product-list [products]="products()" (productDelete)="deleteProduct($event)" (selectProduct)="selectProduct($event)" />
</div>
