<div class="users-container">
  <h2 class="users-title">Users Management</h2>

  <p class="users-total">
    Total Users: <span class="badge">{{ userState.totalUsers() }}</span>
  </p>

  <div class="users-list">
    @for (user of userState.users(); track user.id) {
      <div class="user-card">
        <div class="user-info">
           <span class="user-name">{{ user.id}}</span>
          <span class="user-name">{{ user.name }}</span>
          <span class="user-role">{{ user.role }}</span>
        </div>

        <button class="btn btn-danger" (click)="userState.deleteUser(user.id)">
          Delete
        </button>
      </div>
    }
  </div>

  <button class="btn btn-primary" (click)="addUser()">Add User</button>
</div>
